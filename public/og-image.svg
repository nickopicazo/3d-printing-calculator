<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#0F172A"/>

  <!-- Grid Background -->
  <g stroke="#1E293B" stroke-width="1.5" opacity="0.7">
    <path d="M0 100 H1200 M0 200 H1200 M0 300 H1200 M0 400 H1200 M0 500 H1200" />
    <path d="M200 0 V630 M400 0 V630 M600 0 V630 M800 0 V630 M1000 0 V630" />
  </g>

  <!-- Glowing Accent Light -->
  <circle cx="950" cy="315" r="300" fill="#06B6D4" opacity="0.12"/>

  <!-- Left Side: Branding & Copy -->
  <g transform="translate(100, 180)">
    <!-- Badge -->
    <rect width="210" height="36" rx="18" fill="#1E293B" stroke="#06B6D4" stroke-width="1"/>
    <text x="105" y="23" font-family="system-ui, sans-serif" font-weight="700" font-size="14" fill="#10B981" text-anchor="middle" letter-spacing="1">ACCURATE &amp; FAST</text>

    <!-- Title -->
    <text x="0" y="110" font-family="system-ui, sans-serif" font-weight="900" font-size="64" fill="#F8FAFC">3D Printing</text>
    <text x="0" y="175" font-family="system-ui, sans-serif" font-weight="900" font-size="64" fill="#06B6D4">Calculator</text>

    <!-- Subtitle -->
    <text x="0" y="235" font-family="system-ui, sans-serif" font-weight="400" font-size="24" fill="#94A3B8">Instant Filament, Power &amp; Production Cost Estimation</text>
  </g>

  <!-- Right Side: Graphic Representation -->
  <g transform="translate(800, 180)">
    <rect width="260" height="260" rx="40" fill="#1E293B" stroke="#334155" stroke-width="2"/>
    <path d="M130 40 L210 80 L130 120 L50 80 Z" fill="#06B6D4"/>
    <path d="M50 80 L130 120 L130 210 L50 170 Z" fill="#0891B2"/>
    <path d="M210 80 L130 120 L130 210 L210 170 Z" fill="#0284C7"/>
    <!-- Screen Accent -->
    <polygon points="145,130 200,102 200,115 145,143" fill="#10B981"/>
    <path d="M120 15 L140 15 L135 32 L125 32 Z" fill="#F59E0B"/>
  </g>
</svg>
